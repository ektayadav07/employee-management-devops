name: CI/CD

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::064123637958:role/GitHubActions-ECR-Deployment
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t employee-management-app .

      - name: Tag Docker image
        run: |
          docker tag employee-management-app:latest 064123637958.dkr.ecr.ap-south-1.amazonaws.com/employee-management-app:latest

      - name: Push Docker image to ECR
        run: |
          docker push 064123637958.dkr.ecr.ap-south-1.amazonaws.com/employee-management-app:latest
                - name: Test SSM connection
      - name: Test SSM connection
        run: |
          aws ssm send-command \
            --instance-ids i-029984bb2dd449978 \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo GitHub Actions connected to EC2 through SSM"]}' \
            --region ap-south-1
